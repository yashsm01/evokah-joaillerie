<div class="announcement-bar">
  <p>✦ Complimentary shipping on all orders &nbsp;|&nbsp; Book a private consultation &nbsp;|&nbsp; Ethical &amp; sustainable jewellery ✦</p>
</div>

<header class="header" [class.scrolled]="scrolled">
  <div class="header-inner">
    <nav class="nav-left">
      <a routerLink="/" class="nav-link">Collections</a>
      <a routerLink="/engagement" class="nav-link">Engagement</a>
      <a routerLink="/wedding" class="nav-link">Wedding</a>
    </nav>

    <a routerLink="/" class="logo">
      <span class="logo-top">EVOKAH</span>
      <span class="logo-sub">JOAILLERIE</span>
    </a>

    <nav class="nav-right">
      <a routerLink="/story" class="nav-link">Our Story</a>
      <a routerLink="/atelier" class="nav-link">Atelier</a>

      <div class="header-icons">

        <!-- ── Theme Switcher ── -->
        <div class="theme-switcher" [class.open]="themeMenuOpen">
          <button class="icon-btn theme-btn"
                  (click)="toggleThemeMenu()"
                  [title]="'Theme: ' + themeSvc.current()"
                  aria-label="Switch theme">
            <!-- Palette icon -->
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="12" r="10"/>
              <circle cx="8"  cy="10" r="1.5" fill="currentColor" stroke="none"/>
              <circle cx="12" cy="7"  r="1.5" fill="currentColor" stroke="none"/>
              <circle cx="16" cy="10" r="1.5" fill="currentColor" stroke="none"/>
              <circle cx="14" cy="14.5" r="1.5" fill="currentColor" stroke="none"/>
              <circle cx="9"  cy="14.5" r="1.5" fill="currentColor" stroke="none"/>
            </svg>
          </button>

          <div class="theme-menu" *ngIf="themeMenuOpen">
            <p class="theme-menu-label">Palette</p>
            <button *ngFor="let t of themes"
                    class="theme-option"
                    [class.active]="themeSvc.current() === t.key"
                    (click)="switchTheme(t.key)"
                    type="button">
              <span class="theme-dot" [style.background]="t.dot"></span>
              {{ t.label }}
              <span class="theme-check" *ngIf="themeSvc.current() === t.key">✓</span>
            </button>
          </div>
        </div>

        <!-- ── Search ── -->
        <button class="icon-btn" (click)="toggleSearch()" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </button>

        <!-- ── Wishlist ── -->
        <button class="icon-btn" aria-label="Wishlist">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        </button>

        <!-- ── Cart ── -->
        <button class="icon-btn cart-btn" routerLink="/cart" aria-label="Cart">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
          <span class="cart-badge" *ngIf="cart.count() > 0">{{ cart.count() }}</span>
        </button>

      </div>
    </nav>
  </div>

  <div class="search-overlay" [class.open]="searchOpen">
    <input type="search" placeholder="Search rings, gemstones, styles…" class="search-input" />
    <button class="search-close" (click)="closeSearch()">✕</button>
  </div>
</header>
